<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ps5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ps5White" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ps5Black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ps5Glow">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#ps5Bg)"/>
  
  <!-- Glow effect -->
  <ellipse cx="200" cy="150" rx="140" ry="100" fill="url(#ps5Glow)" opacity="0.3"/>
  
  <!-- PS5 Console - Left white panel -->
  <path d="M 140 80 Q 135 150 140 220 L 165 215 Q 160 150 165 85 Z" fill="url(#ps5White)"/>
  
  <!-- PS5 Console - Center black panel -->
  <rect x="165" y="85" width="70" height="130" fill="url(#ps5Black)" rx="2"/>
  
  <!-- PS5 Console - Right white panel -->
  <path d="M 235 85 Q 240 150 235 215 L 260 220 Q 265 150 260 80 Z" fill="url(#ps5White)"/>
  
  <!-- Blue LED light strip -->
  <rect x="165" y="140" width="70" height="3" fill="#00a8ff" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- PS5 Controller -->
  <ellipse cx="200" cy="240" rx="50" ry="20" fill="#f5f5f5" opacity="0.9"/>
  <ellipse cx="200" cy="238" rx="48" ry="18" fill="#ffffff"/>
  
  <!-- Controller details -->
  <circle cx="185" cy="238" r="6" fill="#00a8ff" opacity="0.6"/>
  <circle cx="215" cy="238" r="6" fill="#00a8ff" opacity="0.6"/>
  
  <!-- PS Button -->
  <circle cx="200" cy="238" r="4" fill="#00a8ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>