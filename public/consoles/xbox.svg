<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="xboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e3e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xboxConsole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="xboxGlow">
      <stop offset="0%" style="stop-color:#107c10;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0a5c0a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#xboxBg)"/>
  
  <!-- Green glow -->
  <ellipse cx="200" cy="140" rx="130" ry="90" fill="url(#xboxGlow)" opacity="0.4"/>
  
  <!-- Xbox Series X Console (monolith shape) -->
  <rect x="150" y="70" width="100" height="150" fill="url(#xboxConsole)" rx="3"/>
  
  <!-- Top vent details -->
  <circle cx="200" cy="90" r="30" fill="#0a0a0a"/>
  <circle cx="200" cy="90" r="28" fill="#050505"/>
  
  <!-- Vent holes pattern -->
  <g opacity="0.3">
    <circle cx="190" cy="85" r="2" fill="#107c10"/>
    <circle cx="200" cy="85" r="2" fill="#107c10"/>
    <circle cx="210" cy="85" r="2" fill="#107c10"/>
    <circle cx="195" cy="90" r="2" fill="#107c10"/>
    <circle cx="205" cy="90" r="2" fill="#107c10"/>
    <circle cx="190" cy="95" r="2" fill="#107c10"/>
    <circle cx="200" cy="95" r="2" fill="#107c10"/>
    <circle cx="210" cy="95" r="2" fill="#107c10"/>
  </g>
  
  <!-- Xbox button with glow -->
  <circle cx="200" cy="145" r="12" fill="#107c10" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="145" r="8" fill="#1aff1a" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Xbox logo -->
  <path d="M 200 142 Q 195 145 195 150 Q 195 152 197 152 Q 198 149 200 147 Q 202 149 203 152 Q 205 152 205 150 Q 205 145 200 142 Z" fill="#0d0d0d"/>
  
  <!-- Controller -->
  <ellipse cx="200" cy="240" rx="55" ry="22" fill="#1a1a1a" opacity="0.9"/>
  <ellipse cx="200" cy="238" rx="52" ry="20" fill="#2a2a2a"/>
  
  <!-- Controller buttons -->
  <circle cx="185" cy="238" r="7" fill="#107c10" opacity="0.5"/>
  <circle cx="215" cy="238" r="7" fill="#107c10" opacity="0.5"/>
  <circle cx="200" cy="238" r="5" fill="#1aff1a" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>