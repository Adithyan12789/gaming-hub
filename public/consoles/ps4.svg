<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ps4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ps4Console" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ps4Glow">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#ps4Bg)"/>
  
  <!-- Blue glow -->
  <ellipse cx="200" cy="145" rx="130" ry="85" fill="url(#ps4Glow)" opacity="0.3"/>
  
  <!-- PS4 Console (slanted box design) -->
  <path d="M 130 105 L 270 105 L 265 180 L 135 180 Z" fill="url(#ps4Console)"/>
  
  <!-- Top glossy panel -->
  <path d="M 132 107 L 268 107 L 263 145 L 137 145 Z" fill="#000000" opacity="0.3"/>
  
  <!-- PS4 Logo slot -->
  <rect x="180" y="120" width="40" height="8" rx="1" fill="#1a1a1a"/>
  
  <!-- Light bar -->
  <rect x="150" y="142" width="100" height="3" fill="#3498db" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Front panel details -->
  <rect x="155" y="165" width="3" height="10" rx="1" fill="#2d3436"/>
  <rect x="242" y="165" width="3" height="10" rx="1" fill="#2d3436"/>
  
  <!-- Power button -->
  <circle cx="165" cy="170" r="3" fill="#3498db" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eject button -->
  <circle cx="235" cy="170" r="2" fill="#ecf0f1" opacity="0.5"/>
  
  <!-- DualShock 4 Controller -->
  <ellipse cx="200" cy="235" rx="55" ry="22" fill="#1a1a1a" opacity="0.9"/>
  <ellipse cx="200" cy="233" rx="52" ry="20" fill="#2d3436"/>
  
  <!-- Light bar on controller -->
  <rect x="185" y="223" width="30" height="4" rx="2" fill="#3498db" opacity="0.7">
    <animate attributeName="fill" values="#3498db;#e74c3c;#2ecc71;#3498db" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Analog sticks -->
  <circle cx="185" cy="233" r="7" fill="#1a1a1a"/>
  <circle cx="185" cy="233" r="5" fill="#000000"/>
  <circle cx="215" cy="233" r="7" fill="#1a1a1a"/>
  <circle cx="215" cy="233" r="5" fill="#000000"/>
  
  <!-- PS Button -->
  <circle cx="200" cy="233" r="4" fill="#3498db" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>