<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b2838;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steamScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a475e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="steamGlow">
      <stop offset="0%" style="stop-color:#66c0f4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#steamBg)"/>
  
  <!-- Steam glow effect -->
  <ellipse cx="200" cy="145" rx="170" ry="80" fill="url(#steamGlow)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Left grip -->
  <ellipse cx="105" cy="150" rx="25" ry="55" fill="url(#deckBody)"/>
  <ellipse cx="105" cy="150" rx="20" ry="50" fill="#1a1a1a"/>
  
  <!-- Main body -->
  <rect x="130" y="100" width="140" height="100" rx="8" fill="url(#deckBody)"/>
  
  <!-- Screen -->
  <rect x="145" y="110" width="110" height="80" rx="4" fill="#0a0a0a"/>
  <rect x="148" y="113" width="104" height="74" rx="3" fill="url(#steamScreen)"/>
  
  <!-- Screen content with Steam logo -->
  <rect x="150" y="115" width="100" height="70" rx="2" fill="#1b2838"/>
  <circle cx="200" cy="150" r="18" fill="#66c0f4" opacity="0.2"/>
  
  <!-- Steam logo -->
  <circle cx="192" cy="150" r="8" fill="#66c0f4" opacity="0.7"/>
  <circle cx="192" cy="150" r="5" fill="#1b2838"/>
  <rect x="197" y="145" width="12" height="10" fill="#66c0f4" opacity="0.7"/>
  <circle cx="207" cy="150" r="5" fill="#66c0f4" opacity="0.7"/>
  
  <!-- Right grip -->
  <ellipse cx="295" cy="150" rx="25" ry="55" fill="url(#deckBody)"/>
  <ellipse cx="295" cy="150" rx="20" ry="50" fill="#1a1a1a"/>
  
  <!-- Left controls -->
  <g opacity="0.8">
    <!-- Left analog stick -->
    <circle cx="115" cy="130" r="14" fill="#0d0d0d"/>
    <circle cx="115" cy="130" r="11" fill="#2d3436"/>
    <circle cx="115" cy="130" r="8" fill="#1a1a1a"/>
    
    <!-- Left trackpad -->
    <circle cx="115" cy="170" r="16" fill="#0d0d0d"/>
    <circle cx="115" cy="170" r="14" fill="#1a1a1a" opacity="0.6"/>
  </g>
  
  <!-- Right controls -->
  <g opacity="0.8">
    <!-- Right analog stick -->
    <circle cx="285" cy="170" r="14" fill="#0d0d0d"/>
    <circle cx="285" cy="170" r="11" fill="#2d3436"/>
    <circle cx="285" cy="170" r="8" fill="#1a1a1a"/>
    
    <!-- Right trackpad -->
    <circle cx="285" cy="130" r="16" fill="#0d0d0d"/>
    <circle cx="285" cy="130" r="14" fill="#1a1a1a" opacity="0.6"/>
  </g>
  
  <!-- D-pad -->
  <rect x="135" y="125" width="6" height="16" rx="2" fill="#2d3436"/>
  <rect x="129" y="131" width="18" height="6" rx="2" fill="#2d3436"/>
  
  <!-- ABXY buttons -->
  <circle cx="260" cy="125" r="4" fill="#66c0f4" opacity="0.5"/>
  <circle cx="252" cy="133" r="4" fill="#66c0f4" opacity="0.5"/>
  <circle cx="268" cy="133" r="4" fill="#66c0f4" opacity="0.5"/>
  <circle cx="260" cy="141" r="4" fill="#66c0f4" opacity="0.5"/>
  
  <!-- Steam button -->
  <circle cx="165" cy="195" r="6" fill="#1a1a1a"/>
  <circle cx="165" cy="195" r="4" fill="#66c0f4" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Menu button -->
  <circle cx="235" cy="195" r="6" fill="#1a1a1a"/>
  <rect x="232" y="193" width="6" height="1" fill="#66c0f4" opacity="0.5"/>
  <rect x="232" y="195" width="6" height="1" fill="#66c0f4" opacity="0.5"/>
  <rect x="232" y="197" width="6" height="1" fill="#66c0f4" opacity="0.5"/>
  
  <!-- Shoulder buttons indicators -->
  <rect x="145" y="105" width="20" height="3" rx="1" fill="#2d3436"/>
  <rect x="235" y="105" width="20" height="3" rx="1" fill="#2d3436"/>
  
  <!-- Power LED -->
  <circle cx="200" cy="105" r="2" fill="#66c0f4" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>